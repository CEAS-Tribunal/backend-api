openapi: 3.0.3
info:
  title: Tribunal API
  version: 1.0.0
  description: API for managing tribunal dashboard
paths:
  /api/resume-review-day/employer/:
    post:
      operationId: api_resume_review_day_employer_create
      tags:
      - api
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/resume-review-day/student/:
    post:
      operationId: api_resume_review_day_student_create
      tags:
      - api
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/resume-review-day/timeslots/:
    get:
      operationId: api_resume_review_day_timeslots_retrieve
      tags:
      - api
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/token/:
    post:
      operationId: api_token_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/token/refresh/:
    post:
      operationId: api_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/token/verify/:
    post:
      operationId: api_token_verify_create
      description: |-
        Takes a token and indicates if it is valid.  This view provides no
        information about a token's fitness for a particular use.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenVerify'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenVerify'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenVerify'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenVerify'
          description: ''
  /dashboard/exec-member/:
    get:
      operationId: dashboard_exec_member_retrieve
      tags:
      - dashboard
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecMember'
          description: ''
    post:
      operationId: dashboard_exec_member_create
      tags:
      - dashboard
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecMember'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ExecMember'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ExecMember'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecMember'
          description: ''
    put:
      operationId: dashboard_exec_member_update
      tags:
      - dashboard
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecMember'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ExecMember'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ExecMember'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecMember'
          description: ''
    delete:
      operationId: dashboard_exec_member_destroy
      tags:
      - dashboard
      security:
      - jwtAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /dashboard/exec-role/:
    get:
      operationId: dashboard_exec_role_retrieve
      tags:
      - dashboard
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecRole'
          description: ''
    post:
      operationId: dashboard_exec_role_create
      tags:
      - dashboard
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecRole'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ExecRole'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ExecRole'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecRole'
          description: ''
    put:
      operationId: dashboard_exec_role_update
      tags:
      - dashboard
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecRole'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ExecRole'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ExecRole'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecRole'
          description: ''
    delete:
      operationId: dashboard_exec_role_destroy
      tags:
      - dashboard
      security:
      - jwtAuth: []
      - {}
      responses:
        '204':
          description: No response body
components:
  schemas:
    CommitteeEnum:
      enum:
      - pres
      - cos
      - vpe
      - vpca
      type: string
      description: |-
        * `pres` - President
        * `cos` - Chief of Staff
        * `vpe` - Events Committees
        * `vpca` - Collegiate Affairs Committees
    ExecMember:
      type: object
      description: Exposes id, name, email, imgURL for API; name and email come from
        the related User.
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
        email:
          type: string
          readOnly: true
        imgURL:
          type: string
          format: uri
          nullable: true
          maxLength: 200
        user:
          type: integer
          writeOnly: true
      required:
      - email
      - id
      - name
      - user
    ExecRole:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        role:
          type: string
          maxLength: 50
        description:
          type: string
        committee:
          $ref: '#/components/schemas/CommitteeEnum'
        ExecMember:
          type: array
          items:
            type: string
            title: ExecMember
      required:
      - ExecMember
      - committee
      - description
      - id
      - role
    TokenObtainPair:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - password
      - refresh
      - username
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          writeOnly: true
      required:
      - access
      - refresh
    TokenVerify:
      type: object
      properties:
        token:
          type: string
          writeOnly: true
      required:
      - token
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
