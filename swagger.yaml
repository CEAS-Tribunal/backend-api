openapi: 3.0.3
info:
  title: Tribunal Backend API
  description: API for managing executive members and roles
  version: 1.0.0

servers:
  - url: /api
    description: API base URL

tags:
  - name: member
    description: something
  - name: role
    description: something else
  - name: reimbursement
    description: else
  - name: Resume Review Day
    description: something

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # NO MORE PROGRESS

    ExecMember:
      type: object
      properties:
        id:
          type: string
          description: CUID format identifier
          readOnly: true
        name:
          type: string
          maxLength: 30
          # major
        email:
          type: string
          format: email
        imgURL:
          type: string
          format: uri
          nullable: true
      required:
        - name
        - email

    ExecRole:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        role:
          type: string
          maxLength: 50
        description:
          type: string
        ExecMember:
          type: array
          items:
            type: string
            description: ExecMember IDs
      required:
        - role
        - description

    Reimbursement:
       type: object
       properties:
         id:
           type: integer
           readOnly: true
         name:
           type: string
         position:
           type: string
         email:
           type: string
         mid:
           type: string
         vendorID:
           type: integer
         date:
           type: string
         vendor:
           type: string
         amount:
           type: integer
         description:
           type: string
         status:
           type: string
         type:
           type: string
       required:
         - all


    ResumeReviewDayStudents:
       type: object
       properties:
         id:
           type: integer
           readOnly: true
         name:
           type: string
         email:
           type: string
         major:
           type: string
         year:
           type: string
         company_id:
           type: string
         time:
           type: string
         slot:
           type: string
         resume:
           type: string
         signUpTime:
           type: string
       required:
         - all

    ResumeReviewDayEmployers:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
        email:
          type: string
        company:
          type: string
        phone:
          type: integer
        review_method:
          type: integer
        diet:
          type: string
        start:
          type: string
        end:
          type: string
        maxResumes:
          type: integer
        alumnus:
          type: boolean
        majors:
          type: string
        signUpTime:
          type: string
      required:
        - all
    Error:
      type: object
      properties:
        error:
          type: object
          description: Error details



security:
  - BearerAuth: []

paths:
  /exec-member/:
    get:
      tags:
        - member
      summary: Get all executive members
      description: Retrieves a list of all executive member names
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  members:
                    type: array
                    items:
                      type: string
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Admin access required

    post:
      tags:
        - member
      summary: Create a new executive member
      description: Creates a new executive member entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecMember'
      responses:
        '201':
          description: Member created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Member created successfully
                  member:
                    $ref: '#/components/schemas/ExecMember'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Admin access required

    put:
      tags:
        - member
      summary: Update an executive member
      description: Updates an existing executive member's information
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ExecMember'
                - type: object
                  properties:
                    id:
                      type: string
                  required:
                    - id
      responses:
        '200':
          description: Member updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Member updated successfully
                  member:
                    $ref: '#/components/schemas/ExecMember'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Member not found
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Admin access required

    delete:
      tags:
        - member
      summary: Delete an executive member
      description: Deletes an existing executive member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
              required:
                - id
      responses:
        '200':
          description: Member deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Member deleted successfully
        '400':
          description: Bad request
        '404':
          description: Member not found
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Admin access required

  /exec-role/:
    get:
      tags:
        - role
      summary: Get all executive roles
      description: Retrieves a list of all executive role names
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  roles:
                    type: array
                    items:
                      type: string
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Admin access required

    post:
      tags:
        - role
      summary: Create a new executive role
      description: Creates a new executive role entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecRole'
      responses:
        '201':
          description: Role created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Role created successfully
                  role:
                    $ref: '#/components/schemas/ExecRole'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Admin access required

    put:
      tags:
        - role
      summary: Update an executive role
      description: Updates an existing executive role's information
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ExecRole'
                - type: object
                  properties:
                    id:
                      type: integer
                  required:
                    - id
      responses:
        '200':
          description: Role updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Role updated successfully
                  role:
                    $ref: '#/components/schemas/ExecRole'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Role not found
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Admin access required

    delete:
      tags:
        - role
      summary: Delete an executive role
      description: Deletes an existing executive role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
              required:
                - id
      responses:
        '200':
          description: Role deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Role deleted successfully
        '400':
          description: Bad request
        '404':
          description: Role not found
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Admin access required

  /reimbursement/:
    # PDF RESPONSE OF RECENT ENTRIES
    post:
      tags:
        - reimbursement
      summary: Create a new reimbursement request
      description: Creates a new reimbursement DB entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reimbursement'
      responses:
        '201':
          description: Request created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Request created successfully
                  reimbursement:
                    $ref: '#/components/schemas/Reimbursement'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Admin access required

    # RESUME REVIEW DAY
    # STUDENT POST
    # EMPLOYER POST
    # BULK GET OF ALL RESUMES

